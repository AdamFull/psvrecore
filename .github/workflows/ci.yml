# Builds the toolkit and runs its unit tests (no game data or SDK files) on Windows and Linux, and checks that the
# Android preset configures with the NDK.
name: ci

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-x64-debug, windows-x64-release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1 -Preset ${{ matrix.preset }}
      - name: LLVM for the disassembler check
        # (the reference is llvm-objdump 22: older ones print some operands wrongly and track IT blocks otherwise)
        if: matrix.preset == 'windows-x64-release'
        shell: pwsh
        run: |
          choco upgrade llvm -y --no-progress
          & "C:/Program Files/LLVM/bin/llvm-objdump.exe" --version
      - name: Disassembler against llvm-objdump
        if: matrix.preset == 'windows-x64-release'
        shell: pwsh
        run: python scripts/arm_check.py --objdump "C:/Program Files/LLVM/bin/llvm-objdump.exe" --psvdis build/${{ matrix.preset }}/tools/psvdis/psvdis.exe --samples 200000 --show 20

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-x64-debug, linux-x64-release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        # (SDL needs X11 or Wayland to build its video; Mesa's lavapipe and the validation layers run the GPU tests)
        run: >
          sudo apt-get update && sudo apt-get install -y clang ninja-build
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev
          libwayland-dev wayland-protocols libegl1-mesa-dev libasound2-dev libpulse-dev libudev-dev
          mesa-vulkan-drivers libvulkan1 vulkan-validationlayers
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  android-configure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        # The runner image provides the newest NDK in ANDROID_NDK_LATEST_HOME.
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cmake --preset android-arm64-release
